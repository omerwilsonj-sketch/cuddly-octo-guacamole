<svg width="400" height="250" viewBox="0 0 400 250" xmlns="http://www.w3.org/2000/svg">
  <!-- Fonts -->
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700&amp;display=swap');
      .text-fluent { font-family: 'Montserrat', sans-serif; font-size: 38px; font-weight: 700; fill: #1A5F7A; letter-spacing: 1px; }
      .text-spanish { font-family: 'Montserrat', sans-serif; font-size: 18px; font-weight: 600; fill: #C45B28; letter-spacing: 8px; }
    </style>
  </defs>
  
  <!-- Premium Logo Mark (Global/Path Circle) -->
  <g transform="translate(150, 20)">
    <!-- Main Circle (Teal) -->
    <circle cx="50" cy="50" r="50" fill="#1A5F7A" />
    
    <!-- Elegant Swoosh/Path (Terracotta) -->
    <path d="M 0 50 Q 20 40 50 50 T 100 50 L 100 100 Q 50 110 0 100 Z" fill="#C45B28" opacity="0.95" transform="rotate(-30 50 50)" />
    
    <!-- Accent Line (Gold) -->
    <path d="M 10 60 Q 50 40 90 60" fill="none" stroke="#F2BE22" stroke-width="3" stroke-linecap="round" transform="rotate(-30 50 50)" />
  </g>
  
  <!-- Logo Text -->
  <g transform="translate(200, 170)" text-anchor="middle">
    <text y="0" class="text-fluent">FLUENTPATH</text>
    <text y="40" class="text-spanish">SPANISH</text>
  </g>
</svg>