<svg width="400" height="150" viewBox="0 0 400 150" xmlns="http://www.w3.org/2000/svg">
  <!-- Fonts -->
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700&amp;display=swap');
      .text-fluent { font-family: 'Montserrat', sans-serif; font-size: 36px; font-weight: 700; fill: #0F4C5C; }
      .text-path { font-family: 'Montserrat', sans-serif; font-size: 36px; font-weight: 700; fill: #E36414; }
      .text-spanish { font-family: 'Montserrat', sans-serif; font-size: 14px; font-weight: 600; fill: #2B2D42; letter-spacing: 4px; }
    </style>
  </defs>

  <!-- Logo Mark -->
  <g transform="translate(20, 25)">
    <!-- Back bubble (Teal) -->
    <rect x="0" y="0" width="50" height="40" rx="12" fill="#0F4C5C" />
    <polygon points="10,40 20,40 10,50" fill="#0F4C5C" />
    
    <!-- Front bubble (Terracotta) -->
    <rect x="25" y="20" width="50" height="40" rx="12" fill="#E36414" />
    <polygon points="65,60 55,60 65,70" fill="#E36414" />

    <!-- Path inside front bubble -->
    <path d="M 35 45 Q 45 30 55 45 Q 60 50 65 40" fill="none" stroke="#FAFAFA" stroke-width="3" stroke-linecap="round" />
  </g>

  <!-- Logo Text -->
  <text x="120" y="70" class="text-fluent">Fluent</text>
  <text x="250" y="70" class="text-path">Path</text>
  <text x="125" y="95" class="text-spanish">SPANISH</text>
</svg>